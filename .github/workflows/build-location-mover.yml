name: Build Location Mover APK
on:
  push:
    branches:
      - build/location-mover-apk-2026-11-17
    paths:
      - 'location-mover/**'
      - '.github/workflows/build-location-mover.yml'
  pull_request:
    paths:
      - 'location-mover/**'
      - '.github/workflows/build-location-mover.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: location-mover
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile signed debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Location-Mover-Android-APK
          path: location-mover/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
